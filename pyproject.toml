[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financial-planner"
dynamic = ["version"]   # from src/financial_planner/__init__.py
description = "A local, private household budget and long-term financial planner driven by CSVs and YAML."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Brookie Guzder-Williams" }]
keywords = ["budget", "personal finance", "retirement", "529", "planner", "household"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
desktop = ["pystray>=0.19", "pillow>=10"]   # menu-bar app (financial_planner.desktop)

[project.urls]
Homepage = "https://github.com/brookisme/financial_planner"
Documentation = "https://github.com/brookisme/financial_planner/wiki"
Issues = "https://github.com/brookisme/financial_planner/issues"

[project.scripts]
financial_plan = "financial_planner.cli:main"

[tool.hatch.version]
path = "src/financial_planner/__init__.py"
pattern = "__version__: str = '(?P<version>[^']+)'"

[tool.hatch.build.targets.sdist]
exclude = ["/web/node_modules", "/installer/dist", "/assets", "/.pixi", "/dist"]

[tool.hatch.build.targets.wheel]
packages = ["src/financial_planner"]

[tool.hatch.build.targets.wheel.force-include]
"examples/demo/config" = "financial_planner/templates/demo/config"
"examples/demo/data" = "financial_planner/templates/demo/data"

[tool.pytest.ini_options]
testpaths = ["tests"]

#
# pixi
#
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.14"

[tool.pixi.pypi-dependencies]
financial-planner = { path = ".", editable = true, extras = ["desktop"] }

[tool.pixi.feature.dev.dependencies]
nodejs = ">=20"
pytest = ">=8"
httpx = ">=0.27"
python-build = "*"
twine = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
start = "financial_plan start"
demo = "financial_plan start examples/demo"

[tool.pixi.feature.dev.tasks]
test = "pytest"
web-install = { cmd = "npm install", cwd = "web" }
web-build = { cmd = "npm run build", cwd = "web", depends-on = ["web-install"] }
web-test = { cmd = "npm test", cwd = "web", depends-on = ["web-install"] }
web-check = { cmd = "npm run check", cwd = "web", depends-on = ["web-install"] }
demo-data = "python scripts/make_demo_data.py examples/demo"
test-all = { depends-on = ["test", "web-test"] }
# releasing (see the wiki's Releasing page)
dist-clean = "rm -rf dist"
dist-build = { cmd = "python -m build", depends-on = ["dist-clean", "web-build"] }
dist-check = { cmd = "twine check --strict dist/*", depends-on = ["dist-build"] }
publish-test = { cmd = "twine upload --repository testpypi dist/*", depends-on = ["dist-check"] }
publish = { cmd = "twine upload dist/*", depends-on = ["dist-check"] }
