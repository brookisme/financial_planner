# The environment the desktop app installs on first launch (NOT the dev pyproject.toml).
# It's copied to ~/Library/Application Support/FinancialPlanner/env/ and installed there.
# financial-planner comes from PyPI (no git needed); "Check for Updates…" in the menu-bar icon
# runs `pixi update`, which picks up new releases within the version range below.
# make-local-app.sh can swap the git source for a local checkout (FP_SOURCE=/path).

[workspace]
name = "financial-planner-app"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64"]

[dependencies]
python = ">=3.11,<3.14"

[pypi-dependencies]
financial-planner = { version = ">=0.1,<1", extras = ["desktop"] }
