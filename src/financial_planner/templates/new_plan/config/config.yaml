# Your plan. Edit here or with the gear icon (top right) in the app.
# Privacy: this folder holds your financial data. Keep it on your own computer, don't commit it to
# a public repository, and prefer generic names (Partner A, Child 1) over real ones.

plan:
  title: Household Budget
  subtitle: ''
  months: 12            # average over the last 12 months of transactions

household:
  partners:
    - name: Partner A
      age: 40
      take_home_monthly: 0      # net pay per month
      raise_pct: 0              # yearly raise above inflation
      social_security:
        at_67: 0                # monthly estimate from your Social Security statement
      pensions: []              # e.g. - {name: Pension, estimates: {55: 900, 60: 2800, 65: 5800}}
      accounts: []              # e.g. - {name: 401(k), balance: 50000, monthly: 500}
  children: []                  # e.g. - {age: 8, college_529: {balance: 10000, monthly: 250}}
                                #   (name defaults to Child 1, Child 2, ...)

other_income_monthly: 0
# Contributions: a fixed `monthly`, or `left_pct` (% of what is left each month) with optional
# min_monthly / max_monthly.
savings:
  - {name: Savings account, type: savings, balance: 0, monthly: 0}
  - {name: Emergency fund, type: emergency, balance: 0, monthly: 0}   # add max_balance: 15000
investments:
  - {name: Stocks, type: stocks, balance: 0, return_pct: 0, monthly: 0}
  - {name: Bonds, type: bonds, balance: 0, return_pct: 0, monthly: 0}

assumptions:
  retirement:
    return_pct: 5.5
    inflation_pct: 3
    withdrawal_pct: 4
    tax_pct: 12
    health_insurance_monthly: 0
    default_age: 65
