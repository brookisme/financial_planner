# Demo plan: an entirely fictional household. Copy this folder to start your own plan, or run
# `financial_plan init my_plan` for a blank one.

plan:
  title: Household Budget
  subtitle: A fictional two-partner household with two kids, built from a demo card and checking account.
  months: 12          # average over the last 12 months of transactions
  # today: 2026-01    # the plan's "now"; defaults to the month after the last transaction

household:
  partners:
    - id: alex
      name: Alex
      age: 46
      take_home_monthly: 7220.84
      take_home_note: two paychecks a month
      raise_pct: 0
      social_security:
        at_67: 3100
      pensions:
        - name: Robotics pension
          estimates: {55: 800, 60: 1900, 65: 3400}
          service_years_now: 9
      accounts:
        - name: Old 401(k)
          balance: 148000
          monthly: 0
    - id: jordan
      name: Jordan
      age: 44
      take_home_monthly: 4120
      take_home_note: clinic paycheck
      social_security:
        at_67: 2400
        claim_age: 67
      accounts:
        - name: 403(b)
          balance: 61000
          monthly: 600
  children:
    - id: riley
      name: Riley
      age: 12
      college_529: {balance: 38500, monthly: 500}
      school: flagship
    - id: casey
      name: Casey
      age: 7
      college_529: {balance: 12400, monthly: 500}
      school: flagship

other_income_monthly: 0

# Each contribution is a fixed `monthly` amount, or `left_pct` (a share of what is left each
# month after spending, taxes and the fixed amounts) with optional min_monthly / max_monthly.
savings:
  - id: savings
    name: Savings account
    type: savings
    balance: 6000
    monthly: 300
  - id: emergency
    name: Emergency fund
    type: emergency      # emergency-kind costs (e.g. car repairs) are paid from here
    balance: 9000
    max_balance: 20000   # past this, contributions go to overflow_to
    overflow_to: bonds
    left_pct: 20
    min_monthly: 200
    max_monthly: 1000

investments:
  - id: stocks
    name: Stocks
    type: stocks
    balance: 22000
    return_pct: 6
    monthly: 300
  - id: bonds
    name: Bonds
    type: bonds
    balance: 8000
    return_pct: 4
    monthly: 0

assumptions:
  retirement:
    return_pct: 5.5
    inflation_pct: 3
    withdrawal_pct: 4
    tax_pct: 12
    health_insurance_monthly: 1100
    default_age: 63
  college:
    schools:
      public: {name: Public in-state, cost: 30000}
      flagship: {name: Flagship in-state, cost: 42000}
      private: {name: Private, cost: 68000}
    default_preset: mid

default_category: Other
default_credit_category: Other credits
